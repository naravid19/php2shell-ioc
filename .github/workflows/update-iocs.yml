name: Scheduled IoC Feed Collector

on:
  schedule:
    # Run daily at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect-and-update:
    name: Collect & Update IoC Feeds
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute IoC Collector
        run: |
          python scripts/collect_iocs.py

      - name: Commit and push updated indicators
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add iocs/
          if git diff --staged --quiet; then
            echo "No changes in IoC datasets. Skipping commit."
          else
            git commit -m "chore(iocs): automated feed update [skip ci]"
            git pull --rebase origin main
            git push
          fi
